[project]
name = "chatjimmy-harness"
version = "0.3.0"
description = "CLI evaluation harness for the chatjimmy.ai API (Taalas HC1 / Llama 3.1 8B)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["chatjimmy", "taalas", "llm", "harness", "benchmark", "cli"]
dependencies = [
    "requests>=2.28.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
chatjimmy = "chatjimmy_harness.cli:run"
cj = "chatjimmy_harness.cli:run"
cjh = "chatjimmy_harness.cli:run"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
Upstream = "https://github.com/0xMH/chatjimmy-api"
Homepage = "https://chatjimmy.ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatjimmy_harness"]
